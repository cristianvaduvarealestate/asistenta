# ==============================================================================
# NGINX CONFIGURATION — INSURANCE HELP DESK
# helpdesk.cristianvaduva.com
# ==============================================================================

# Rate limiting zone: max 10 requests/sec per IP, burst 20
limit_req_zone $binary_remote_addr zone=helpdesk_limit:10m rate=10r/s;

# 1. Redirecționare HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.cristianvaduva.com;

    # Validare ACME Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS Principal (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helpdesk.cristianvaduva.com;

    # Certificate SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/helpdesk.cristianvaduva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.cristianvaduva.com/privkey.pem;

    # Protocoale și Ciffruri TLS sigure
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Securitate Antete HTTP (Defense-in-Depth)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Blocare fișiere ascunse, .env, baze de date, backup-uri
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sqlite|sqlite-wal|sqlite-shm|db|bak|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Restricționare endpoint cron intern: permis doar de pe localhost (127.0.0.1)
    location /api/jobs/tick {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache pentru asset-uri statice Next.js (_next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy Principal către aplicația Next.js (Port local 3010)
    location / {
        limit_req zone=helpdesk_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # WebSocket & conexiuni persistente
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarding corect al identității clientului
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts sigure
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
